name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      # Run the suite under v8 coverage; vitest fails the job if any
      # threshold in vitest.config.ts is breached (rise-only ratchet).
      - run: npm run test:coverage

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan working tree for common credential shapes
        run: |
          set -euo pipefail
          # High-signal credential shapes: AWS access keys, GitHub PATs, Slack
          # tokens, Google API keys, private-key PEM headers, and generic
          # bearer/secret assignments. Keep this conservative to stay reliable.
          patterns='AKIA[0-9A-Z]{16}'
          patterns="$patterns"'|gh[pousr]_[0-9A-Za-z]{36,}'
          patterns="$patterns"'|xox[baprs]-[0-9A-Za-z-]{10,}'
          patterns="$patterns"'|AIza[0-9A-Za-z_-]{35}'
          patterns="$patterns"'|-----BEGIN[[:space:]][A-Z ]*PRIVATE KEY-----'
          patterns="$patterns"'|(secret|token|password|passwd|api[_-]?key)[[:space:]]*[:=][[:space:]]*["'\''][0-9A-Za-z/+_-]{20,}["'\'']'
          if git grep -nIE "$patterns" -- ':!.github/workflows/ci.yml'; then
            echo "::error::secret-scan: potential credential found (above)"
            exit 1
          fi
          echo "secret-scan: clean"

  ip-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The denylist is an organisation secret, never a literal in this file.
      # A guard that exists to keep internal identifiers out of a public repo
      # cannot hold those identifiers in a world-readable workflow: the regex
      # was self-evading (one-char classes) so the scan would not match itself,
      # which stops a grep and nothing else — anyone reading the file read the
      # list. A secret rather than a repository variable, because Actions masks
      # a secret's value in the run log and a public repo's logs are public.
      #
      # Update the list (org-scoped, covers both public repos):
      #   gh secret set IP_GUARD_DENYLIST --org ProductionMasterAI \
      #     --visibility selected --repos production-master,production-master-mcp
      # The value is one POSIX ERE alternation, e.g. 'alpha|beta/gamma|two words'.
      - name: Guard against employer / internal identifiers
        env:
          DENYLIST: ${{ secrets.IP_GUARD_DENYLIST }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          # github.actor, not the pull request author: GitHub gates the separate
          # Dependabot secret store on the actor, and the actor stays
          # dependabot[bot] across a re-run (github.triggering_actor does not).
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -z "${DENYLIST}" ]; then
            if [ "${IS_FORK}" = "true" ]; then
              # GitHub withholds every secret AND every configuration variable
              # from a fork's pull request, so no in-repo scheme can supply the
              # list here without publishing it. The same tree is scanned by the
              # push-to-main run, and main requires a review before any merge,
              # so a forbidden identifier still cannot reach main unscanned.
              echo "::notice::ip-guard: denylist unavailable to a fork pull request; enforced on merge to main"
              exit 0
            fi
            if [ "${ACTOR}" = "dependabot[bot]" ]; then
              # The same structural situation on a same-repo branch: a Dependabot
              # run reads a *separate* secret store, so an Actions secret is
              # withheld from it by GitHub's design and no in-repo scheme can
              # supply the list here either. Mirroring the denylist into the
              # Dependabot store would spread the internal identifiers over a
              # second store for no real gain. The argument above still holds:
              # the push-to-main run scans the same tree and main requires a
              # review before any merge, so a forbidden identifier cannot reach
              # main unscanned — and a Dependabot pull request only ever touches
              # manifests, lockfiles or action pins.
              echo "::notice::ip-guard: denylist unavailable to a Dependabot pull request; enforced on merge to main"
              exit 0
            fi
            echo "::error::ip-guard: IP_GUARD_DENYLIST is unset — the guard cannot run"
            exit 1
          fi
          # Report file:line only. Quoting the matched line into a public run
          # log would republish the identifier this job exists to keep unshipped.
          # Collected rather than piped straight into `if`: git grep exits 1 on
          # a clean tree, and reading that through a pipe makes the verdict turn
          # on pipefail rather than on whether anything matched.
          hits="$(git grep -nIE "${DENYLIST}" -- ':!CODEOWNERS' ':!LICENSE' | cut -d: -f1,2 || true)"
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::ip-guard: forbidden identifier found at the locations above"
            exit 1
          fi
          echo "ip-guard: clean"
      - name: No LLM SDK dependencies
        run: |
          set -euo pipefail
          # Product code must depend on no LLM vendor SDK directly. Scan manifests
          # and source for imports/deps of the common providers.
          sdk='@anthropic-ai/|@ai-sdk/|litellm|langchain'
          sdk="$sdk"'|["'\'']openai["'\'']|[[:space:]]openai[[:space:]]*[:@]'
          if git grep -nIE "$sdk" -- '*package.json' '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs'; then
            echo "::error::no-llm-sdk: direct LLM SDK reference found (above)"
            exit 1
          fi
          # The pattern above is written for JS/TS syntax and its pathspec lists
          # only JS/TS file types, so it goes blind the moment a second language
          # lands in the repo. Python source and its manifests get their own
          # pass: an import-anchored form for source, and a dependency-string
          # form for pyproject/requirements, where a provider is named but never
          # imported in the tree.
          pysrc='^[[:space:]]*(import|from)[[:space:]]+'
          pysrc="$pysrc"'(anthropic|openai|litellm|langchain[._a-z]*|cohere|mistralai|google\.generativeai|vertexai)([[:space:].]|$)'
          pysrc="$pysrc"'|bedrock-runtime|bedrock_runtime'
          if git grep -nIE "$pysrc" -- '*.py'; then
            echo "::error::no-llm-sdk: direct LLM SDK reference in Python source (above)"
            exit 1
          fi
          pydep='["'\''](anthropic|openai|litellm|langchain[a-z-]*|cohere|mistralai|google-generativeai)([[:space:]]*[><=~!].*)?["'\'']'
          if git grep -nIE "$pydep" -- '*pyproject.toml' '*requirements*.txt' '*setup.cfg'; then
            echo "::error::no-llm-sdk: LLM SDK named as a Python dependency (above)"
            exit 1
          fi
          echo "no-llm-sdk: clean"

  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in sdk/python/pyproject.toml, and a current
        # release. The SDK is pure-stdlib at runtime, so these two bracket
        # every version it claims to support.
        python-version: ['3.9', '3.13']
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # Test-only dependencies. The package itself declares no runtime deps and
      # is deliberately installed from the working tree, not from an index.
      - run: pip install pytest pytest-cov
      - run: pip install -e .
      # addopts in pyproject.toml carries --cov-fail-under=80, so a coverage
      # regression fails this job without a separate threshold step here.
      - run: python -m pytest
