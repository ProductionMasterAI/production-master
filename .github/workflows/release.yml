name: Release

# Tags this fires on are the plugin's own `v*` tags. The Python SDK versions
# independently under a `python-v*` prefix (see publish-python.yml) so the two
# release trains can never collide on a tag push.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # OIDC trusted publishing to npm (dev#725) — npm exchanges this token for a
  # short-lived publish credential, no long-lived secret required on npm's side.
  id-token: write

jobs:
  release:
    # ubuntu-latest, never the self-hosted fleet: this repo is public and
    # accepts third-party pull requests, so a self-hosted runner here would
    # let a fork execute arbitrary code on the owner's hardware.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; .nvmrc's Node 22.15.0 ships
      # npm 10.9.x, so upgrade npm itself in-job rather than bumping Node.
      # The floor is ASSERTED, not just printed: if the upgrade silently no-ops
      # or resolves an older npm, OIDC would not engage and — with no token
      # wired below — the publish would fail with a confusing auth error
      # instead of naming the real cause.
      - name: Upgrade npm for OIDC trusted publishing (dev#725)
        run: |
          set -euo pipefail
          npm i -g npm@latest
          ver="$(npm --version)"
          echo "npm ${ver}"
          node -e '
            const [have, need] = [process.argv[1], "11.5.1"];
            const cmp = (a, b) => {
              const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
              for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pa[i] - pb[i];
              return 0;
            };
            if (cmp(have, need) < 0) {
              console.log(`::error::npm ${have} is below the ${need} floor required for OIDC trusted publishing`);
              process.exit(1);
            }
            console.log(`npm ${have} meets the ${need} floor for OIDC trusted publishing`);
          ' "$ver"

      - run: npm ci
      - run: npm run build --if-present

      - name: Tag must match every published package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          for pkg in packages/plugin-core packages/pmctl; do
            got="$(node -p "require('./${pkg}/package.json').version")"
            if [ "$got" != "$want" ]; then
              echo "::error::tag ${TAG} implies version ${want} but ${pkg}/package.json declares ${got}"
              exit 1
            fi
          done
          echo "version ${want} matches tag ${TAG} in every publishable package"

      - run: npm run test:coverage

      # Publish order matters: plugin-core has no workspace dependency, but
      # production-master (pmctl) depends on it, so a fresh install of the
      # latter needs it already on the registry.
      #
      # NOTE (dev#725): these publish with OIDC trusted publishing — `id-token:
      # write` above plus npm >= 11.5.1, against the trusted publisher configured
      # on npmjs.com for both packages. There is deliberately NO NODE_AUTH_TOKEN
      # here. npm "uses OIDC before falling back to traditional tokens", and that
      # fallback is SILENT: with a token also wired, a green publish would not
      # distinguish OIDC working from the token quietly carrying it, so the
      # migration could never actually be verified. Without a token, OIDC either
      # works or the release fails loudly — which is the recoverable direction.
      - name: Publish @production-master/plugin-core to npm
        run: npm publish --workspace packages/plugin-core --access public

      - name: Publish production-master (pmctl) to npm
        run: npm publish --workspace packages/pmctl --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
